name: Daily APMC Market Rates Sync

on:
  schedule:
    # Runs at 07:00 UTC (12:30 PM IST) Monday to Saturday (APMC auctions conclude at 11:30 AM IST)
    - cron: '0 7 * * 1-6'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-market-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run daily market sync crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: |
          cd backend
          python scripts/sync_daily_market.py
